[package]
name = "factory-dash"
version = "0.1.0"
edition = "2024"
description = "Live dashboard for embedded-factory runs: tails runs/*/events.jsonl and streams pipeline state to a browser"
license = "MIT"

[[bin]]
name = "factory-dash"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
